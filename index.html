<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>GlobalBLAMP AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="loginScreen" class="login-screen">

    <div class="login-card">

<h1>GlobalBLAMP AI</h1>

<p>
  Login with Telegram to continue.
</p>

<div id="telegramLoginContainer">

  <script
    async
    src="https://telegram.org/js/telegram-widget.js?22"
    data-telegram-login="Blamp_ai_bot"
    data-size="large"
    data-userpic="true"
    data-onauth="onTelegramAuth(user)"
  ></script>

</div>

<p>
  Temporary API login
</p>

<label for="loginApiKeyInput">
  API Key
</label>

      <input
        id="loginApiKeyInput"
        type="password"
        placeholder="gk-..."
        autocomplete="off"
      >

      <button
        id="loginBtn"
        class="primary-button"
      >
        Continue
      </button>

      <div
        id="loginMessage"
        class="login-message"
      ></div>

    </div>

  </div>
  
  <div id="chatApp" class="app hidden">
<div
  id="historyBackdrop"
  class="history-backdrop hidden"
></div>


<aside
  id="historyPanel"
  class="history-panel hidden"
>

  <div class="history-header">

    <h2>Chats</h2>

    <button
      id="closeHistoryBtn"
      class="icon-button"
    >
      ✕
    </button>

  </div>


  <button
    id="newChatBtn"
    class="new-chat-button"
  >
    + New Chat
  </button>


  <div
    id="chatList"
    class="chat-list"
  >

    <div class="history-empty">
      No chats yet.
    </div>

  </div>

</aside>
    
<header class="topbar">

  <button id="historyBtn" class="icon-button">
    ☰
  </button>

<div class="topbar-title">
  <h1>GlobalBLAMP AI</h1>
  <p id="currentChatTitle">New Chat</p>
</div>

  <button id="settingsBtn" class="icon-button">
    ⚙️
  </button>

</header>


    <main id="chatArea" class="chat-area">

      <div class="welcome-message">
        <h2>Welcome</h2>

        <p>
          Enter your API key and select a model to start chatting.
        </p>
      </div>

    </main>


    <div class="composer">

      <textarea
        id="messageInput"
        placeholder="Ask anything..."
        rows="1"
      ></textarea>

      <button id="sendBtn">
        ➤
      </button>

    </div>

  </div>


  <div id="settingsModal" class="modal hidden">

    <div class="modal-card">

      <div class="modal-header">

        <h2>Settings</h2>

        <button id="closeSettingsBtn" class="icon-button">
          ✕
        </button>

      </div>


      <label for="apiKeyInput">
        API Key
      </label>

      <input
        id="apiKeyInput"
        type="password"
        placeholder="gk-..."
      >


      <label for="modelSelect">
        Model
      </label>

      <select id="modelSelect">

        <optgroup label="OpenAI">
          <option value="gpt-5.4">gpt-5.4</option>
          <option value="gpt-5.5">gpt-5.5</option>
          <option value="gpt-5.5-xhigh">gpt-5.5-xhigh</option>
          <option value="gpt-5.6-luna">gpt-5.6-luna</option>
          <option value="gpt-5.6-sol">gpt-5.6-sol</option>
          <option value="gpt-5.6-terra">gpt-5.6-terra</option>
        </optgroup>


        <optgroup label="Anthropic">
          <option value="claude-opus-5">claude-opus-5</option>
          <option value="claude-opus-5-thinking">
            claude-opus-5-thinking
          </option>

          <option value="claude-opus-4-8">
            claude-opus-4-8
          </option>

          <option value="claude-opus-4-7">
            claude-opus-4-7
          </option>

          <option value="claude-opus-4-6">
            claude-opus-4-6
          </option>

          <option value="claude-sonnet-5">
            claude-sonnet-5
          </option>

          <option value="claude-sonnet-5-thinking">
            claude-sonnet-5-thinking
          </option>

          <option value="claude-sonnet-4-6">
            claude-sonnet-4-6
          </option>

          <option value="claude-haiku-4-5">
            claude-haiku-4-5
          </option>

          <option value="claude-fable-5">
            claude-fable-5
          </option>
        </optgroup>


        <optgroup label="DeepSeek">
          <option value="deepseek-v4-pro">
            deepseek-v4-pro
          </option>

          <option value="deepseek-v4-flash">
            deepseek-v4-flash
          </option>
        </optgroup>


        <optgroup label="Qwen">
          <option value="qwen-max">qwen-max</option>
          <option value="qwen-plus">qwen-plus</option>
          <option value="qwen-flash">qwen-flash</option>
          <option value="qwen-coder-plus">
            qwen-coder-plus
          </option>
        </optgroup>


        <optgroup label="Kimi">
          <option value="kimi-k3">kimi-k3</option>
          <option value="kimi-k2.7-code">
            kimi-k2.7-code
          </option>
        </optgroup>


        <optgroup label="GLM">
          <option value="glm-5.3">glm-5.3</option>
          <option value="glm-5.2">glm-5.2</option>
          <option value="glm-5.1">glm-5.1</option>
          <option value="glm-5-turbo">
            glm-5-turbo
          </option>
        </optgroup>

      </select>


      <button id="saveSettingsBtn" class="primary-button">
        Save Settings
      </button>
      <button id="logoutBtn" class="primary-button">
        Logout
      </button>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
