<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>GlobalBLAMP AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<a
  class="skip-link"
  href="#chatArea"
>
  Skip to chat
</a>
  
  <div id="loginScreen" class="login-screen">

    <div class="login-card">

<h1>GlobalBLAMP AI</h1>

<p>
  Login with Telegram to continue.
</p>

<div id="telegramLoginContainer">

  <button
    id="telegramLoginBtn"
    class="primary-button"
    type="button"
  >
    Continue with Telegram
  </button>

</div>

      <div
        id="loginMessage"
        class="login-message"
      ></div>

    </div>

  </div>
  
<div id="chatApp" class="app hidden">

  <div
    id="historyBackdrop"
    class="history-backdrop hidden"
  ></div>


  <aside
    id="historyPanel"
    class="history-panel hidden"
  >

    <div class="sidebar-header">

      <div class="sidebar-brand">

        <div class="sidebar-logo">
          G
        </div>

        <div class="sidebar-brand-text">
          <strong>GlobalBLAMP</strong>
          <span>AI</span>
        </div>

      </div>


      <button
        id="closeHistoryBtn"
        class="icon-button sidebar-close"
        type="button"
        aria-label="Close chats"
      >
        ✕
      </button>

    </div>


    <button
      id="newChatBtn"
      class="new-chat-button"
      type="button"
    >
      <span class="new-chat-plus">+</span>
      <span>New chat</span>
    </button>


<div class="sidebar-search">

  <input
    id="chatSearchInput"
    type="search"
    placeholder="Search chats"
    autocomplete="off"
    aria-label="Search chats"
  >

</div>


<div class="sidebar-label">
  Chats
</div>


<div
  id="chatList"
  class="chat-list"
>

      <div class="history-empty">
        No chats yet.
      </div>

    </div>

  </aside>


  <section class="chat-shell">

    <header class="topbar">

      <div class="topbar-left">

        <button
          id="historyBtn"
          class="icon-button menu-button"
          type="button"
          aria-label="Open chats"
        >
          ☰
        </button>


        <div class="topbar-title">

          <h1 id="currentChatTitle">
            New Chat
          </h1>

          <p>
            GlobalBLAMP AI
          </p>

        </div>

      </div>


<div class="topbar-actions">

  <select
    id="headerModelSelect"
    class="header-model-select"
    aria-label="Select model"
  ></select>


  <button
    id="themeToggleBtn"
    class="icon-button"
    type="button"
    aria-label="Toggle theme"
  >
    ☀
  </button>


  <button
    id="settingsBtn"
    class="icon-button"
    type="button"
    aria-label="Open settings"
  >
    ⚙
  </button>

</div>

    </header>


<main
  id="chatArea"
  class="chat-area"
  tabindex="-1"
>

      <div class="welcome-message">

        <div class="welcome-mark">
          G
        </div>

        <h2>
          How can I help?
        </h2>

        <p>
          Start a conversation with GlobalBLAMP AI.
        </p>

      </div>

    </main>


    <div class="composer-area">
<button
  id="scrollToLatestBtn"
  class="scroll-to-latest hidden"
  type="button"
  aria-label="Scroll to latest message"
>
  ↓
</button>
      <div class="composer">

<textarea
  id="messageInput"
  placeholder="Message GlobalBLAMP..."
  rows="1"
  aria-label="Message GlobalBLAMP AI"
></textarea>


        <button
          id="sendBtn"
          type="button"
          aria-label="Send message"
        >
          <span class="send-arrow"></span>
        </button>

      </div>


      <p class="composer-note">
        GlobalBLAMP AI can make mistakes. Check important information.
      </p>

    </div>

  </section>

</div>


<div
  id="settingsModal"
  class="modal hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="settingsTitle"
>

  <div class="modal-card">

    <div class="modal-header">

      <h2 id="settingsTitle">
        Settings
      </h2>

<button
  id="closeSettingsBtn"
  class="icon-button"
  type="button"
  aria-label="Close settings"
>
  ✕
</button>

      </div>


<label for="apiKeyInput">
  API Key
</label>


<div class="password-field">

  <input
    id="apiKeyInput"
    type="password"
    placeholder="gk-..."
    autocomplete="off"
  >

  <button
    id="toggleApiKeyBtn"
    class="password-toggle"
    type="button"
    aria-label="Show API key"
  >
    Show
  </button>

</div>


<div
  id="settingsStatus"
  class="settings-status hidden"
  role="status"
></div>


      <label for="modelSelect">
        Model
      </label>

      <select id="modelSelect">

        <optgroup label="OpenAI">
          <option value="gpt-5.4">gpt-5.4</option>
          <option value="gpt-5.5">gpt-5.5</option>
          <option value="gpt-5.5-xhigh">gpt-5.5-xhigh</option>
          <option value="gpt-5.6-luna">gpt-5.6-luna</option>
          <option value="gpt-5.6-sol">gpt-5.6-sol</option>
          <option value="gpt-5.6-terra">gpt-5.6-terra</option>
        </optgroup>


        <optgroup label="Anthropic">
          <option value="claude-opus-5">claude-opus-5</option>
          <option value="claude-opus-5-thinking">
            claude-opus-5-thinking
          </option>

          <option value="claude-opus-4-8">
            claude-opus-4-8
          </option>

          <option value="claude-opus-4-7">
            claude-opus-4-7
          </option>

          <option value="claude-opus-4-6">
            claude-opus-4-6
          </option>

          <option value="claude-sonnet-5">
            claude-sonnet-5
          </option>

          <option value="claude-sonnet-5-thinking">
            claude-sonnet-5-thinking
          </option>

          <option value="claude-sonnet-4-6">
            claude-sonnet-4-6
          </option>

          <option value="claude-haiku-4-5">
            claude-haiku-4-5
          </option>

          <option value="claude-fable-5">
            claude-fable-5
          </option>
        </optgroup>


        <optgroup label="DeepSeek">
          <option value="deepseek-v4-pro">
            deepseek-v4-pro
          </option>

          <option value="deepseek-v4-flash">
            deepseek-v4-flash
          </option>
        </optgroup>


        <optgroup label="Qwen">
          <option value="qwen-max">qwen-max</option>
          <option value="qwen-plus">qwen-plus</option>
          <option value="qwen-flash">qwen-flash</option>
          <option value="qwen-coder-plus">
            qwen-coder-plus
          </option>
        </optgroup>


        <optgroup label="Kimi">
          <option value="kimi-k3">kimi-k3</option>
          <option value="kimi-k2.7-code">
            kimi-k2.7-code
          </option>
        </optgroup>


        <optgroup label="GLM">
          <option value="glm-5.3">glm-5.3</option>
          <option value="glm-5.2">glm-5.2</option>
          <option value="glm-5.1">glm-5.1</option>
          <option value="glm-5-turbo">
            glm-5-turbo
          </option>
        </optgroup>

      </select>


<button
  id="saveSettingsBtn"
  class="primary-button"
  type="button"
>
  Save Settings
</button>


<button
  id="logoutBtn"
  class="secondary-danger-button"
  type="button"
>
  Logout
</button>

    </div>

  </div>

<div
  id="confirmModal"
  class="modal hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="confirmTitle"
>

  <div class="modal-card confirm-card">

    <h2 id="confirmTitle">
      Confirm
    </h2>


    <p
      id="confirmMessage"
      class="confirm-message"
    ></p>


    <div class="confirm-actions">

      <button
        id="confirmCancelBtn"
        class="secondary-button"
        type="button"
      >
        Cancel
      </button>


      <button
        id="confirmAcceptBtn"
        class="danger-button"
        type="button"
      >
        Confirm
      </button>

    </div>

  </div>

</div>


<div
  id="appToast"
  class="app-toast hidden"
  role="status"
  aria-live="polite"
></div>
  
  <script src="https://telegram.org/js/telegram-login.js"></script>
  <script src="script.js"></script>

</body>
</html>
