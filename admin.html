<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GlobalBLAMP Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0d;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(900px, 100%);
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #9999a3;
    }

    .card {
      margin-bottom: 20px;
      padding: 18px;
      border: 1px solid #2c2c33;
      border-radius: 16px;
      background: #151519;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #bcbcc5;
    }

    input {
      width: 100%;
      height: 46px;
      margin-bottom: 12px;
      padding: 0 13px;
      border: 1px solid #303038;
      border-radius: 12px;
      outline: none;
      background: #1d1d22;
      color: #ffffff;
    }

    button {
      min-height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .primary {
      background: #ffffff;
      color: #000000;
    }

    .secondary {
      background: #25252b;
      color: #ffffff;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .row button {
      flex: 1;
    }

    .message {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #ff8e8e;
    }

    .success {
      color: #8effb0;
    }

    .accounts {
      display: grid;
      gap: 12px;
    }

    .account-item {
      padding: 14px;
      border: 1px solid #2a2a30;
      border-radius: 14px;
      background: #111114;
    }

    .account-key {
      margin-bottom: 8px;
      font-weight: 700;
    }

    .account-meta {
      display: grid;
      gap: 5px;
      color: #a5a5ae;
      font-size: 13px;
    }

    .status-active {
      color: #8effb0;
    }

    .status-disabled {
      color: #ff9f9f;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="page">

    <h1>GlobalBLAMP Admin</h1>

    <p class="subtitle">
      Manage approved API accounts.
    </p>


    <div class="card">

      <label for="adminSecretInput">
        Admin Secret
      </label>

      <input
        id="adminSecretInput"
        type="password"
        placeholder="Enter ADMIN_SECRET"
      >

      <button
        id="saveSecretBtn"
        class="secondary"
      >
        Save Admin Secret
      </button>

      <div
        id="secretMessage"
        class="message"
      ></div>

    </div>


    <div class="card">

      <label for="apiKeyInput">
        Add Approved gk API Key
      </label>

      <input
        id="apiKeyInput"
        type="password"
        placeholder="gk-..."
      >

      <button
        id="addAccountBtn"
        class="primary"
      >
        Add Account
      </button>

      <div
        id="addMessage"
        class="message"
      ></div>

    </div>


    <div class="card">

      <div class="row">

        <button
          id="refreshBtn"
          class="secondary"
        >
          Refresh Accounts
        </button>

      </div>

      <div
        id="accountsMessage"
        class="message"
      ></div>

      <div
        id="accountsList"
        class="accounts"
      ></div>

    </div>

  </div>


  <script>
    const HISTORY_API =
      "https://history.bluelamp.workers.dev";

    const adminSecretInput =
      document.getElementById("adminSecretInput");

    const apiKeyInput =
      document.getElementById("apiKeyInput");

    const saveSecretBtn =
      document.getElementById("saveSecretBtn");

    const addAccountBtn =
      document.getElementById("addAccountBtn");

    const refreshBtn =
      document.getElementById("refreshBtn");

    const secretMessage =
      document.getElementById("secretMessage");

    const addMessage =
      document.getElementById("addMessage");

    const accountsMessage =
      document.getElementById("accountsMessage");

    const accountsList =
      document.getElementById("accountsList");


    let adminSecret =
      localStorage.getItem("globalblamp_admin_secret") || "";


    adminSecretInput.value = adminSecret;


    function setMessage(element, text, type = "") {
      element.textContent = text;

      element.classList.remove(
        "error",
        "success"
      );

      if (type) {
        element.classList.add(type);
      }
    }


    function getAdminHeaders() {
      return {
        "Content-Type": "application/json",
        "X-Admin-Secret": adminSecret
      };
    }


    saveSecretBtn.addEventListener(
      "click",
      () => {
        const value =
          adminSecretInput.value.trim();

        if (!value) {
          setMessage(
            secretMessage,
            "Enter your admin secret first.",
            "error"
          );

          return;
        }

        adminSecret = value;

        localStorage.setItem(
          "globalblamp_admin_secret",
          adminSecret
        );

        setMessage(
          secretMessage,
          "Admin secret saved on this browser.",
          "success"
        );
      }
    );


    addAccountBtn.addEventListener(
      "click",
      addAccount
    );


    refreshBtn.addEventListener(
      "click",
      loadAccounts
    );


    async function addAccount() {
      if (!adminSecret) {
        setMessage(
          addMessage,
          "Save your admin secret first.",
          "error"
        );

        return;
      }

      const apiKey =
        apiKeyInput.value.trim();

      if (!apiKey) {
        setMessage(
          addMessage,
          "Enter a gk API key.",
          "error"
        );

        return;
      }

      setMessage(
        addMessage,
        "Adding account..."
      );

      try {
        const response = await fetch(
          `${HISTORY_API}/admin/accounts`,
          {
            method: "POST",

            headers: getAdminHeaders(),

            body: JSON.stringify({
              api_key: apiKey
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data?.error || "Unable to add account"
          );
        }

        apiKeyInput.value = "";

        setMessage(
          addMessage,
          `Added ${data.account.key_preview}`,
          "success"
        );

        await loadAccounts();

      } catch (error) {
        setMessage(
          addMessage,
          error.message,
          "error"
        );
      }
    }


    async function loadAccounts() {
      if (!adminSecret) {
        setMessage(
          accountsMessage,
          "Save your admin secret first.",
          "error"
        );

        return;
      }

      setMessage(
        accountsMessage,
        "Loading..."
      );

      accountsList.innerHTML = "";

      try {
        const response = await fetch(
          `${HISTORY_API}/admin/accounts`,
          {
            method: "GET",
            headers: getAdminHeaders()
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data?.error || "Unable to load accounts"
          );
        }

        const accounts =
          Array.isArray(data.accounts)
            ? data.accounts
            : [];

        setMessage(
          accountsMessage,
          `${accounts.length} account(s)`,
          "success"
        );

        if (!accounts.length) {
          accountsList.innerHTML =
            "<div>No approved accounts yet.</div>";

          return;
        }

        for (const account of accounts) {
          const item =
            document.createElement("div");

          item.className = "account-item";

          const status =
            Number(account.is_active) === 1
              ? "Active"
              : "Disabled";

          const statusClass =
            Number(account.is_active) === 1
              ? "status-active"
              : "status-disabled";

          item.innerHTML = `
            <div class="account-key">
              ${escapeHtml(account.key_preview || "Unknown")}
            </div>

            <div class="account-meta">
              <div>
                ID: ${escapeHtml(String(account.id))}
              </div>

              <div class="${statusClass}">
                Status: ${status}
              </div>

              <div>
                Chats: ${escapeHtml(
                  String(account.chat_count || 0)
                )}
              </div>

              <div>
                Created: ${escapeHtml(
                  account.created_at || "-"
                )}
              </div>

              <div>
                Last active: ${escapeHtml(
                  account.last_active_at || "-"
                )}
              </div>
            </div>
          `;

          accountsList.appendChild(item);
        }

      } catch (error) {
        setMessage(
          accountsMessage,
          error.message,
          "error"
        );
      }
    }


    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    if (adminSecret) {
      loadAccounts();
    }
  </script>

</body>
</html>
