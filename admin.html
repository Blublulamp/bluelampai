<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GlobalBLAMP Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0d;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(900px, 100%);
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #9999a3;
    }

    .card {
      margin-bottom: 20px;
      padding: 18px;
      border: 1px solid #2c2c33;
      border-radius: 16px;
      background: #151519;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #bcbcc5;
    }

    input {
      width: 100%;
      height: 46px;
      margin-bottom: 12px;
      padding: 0 13px;
      border: 1px solid #303038;
      border-radius: 12px;
      outline: none;
      background: #1d1d22;
      color: #ffffff;
    }

    button {
      min-height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .primary {
      background: #ffffff;
      color: #000000;
    }

    .secondary {
      background: #25252b;
      color: #ffffff;
    }

    .warning {
      background: #6b4d13;
      color: #ffffff;
    }

    .danger {
      background: #7a2424;
      color: #ffffff;
    }

    .success-button {
      background: #1f6238;
      color: #ffffff;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .row button {
      flex: 1;
    }

    .message {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #ff8e8e;
    }

    .success {
      color: #8effb0;
    }

    .accounts {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .account-item {
      padding: 14px;
      border: 1px solid #2a2a30;
      border-radius: 14px;
      background: #111114;
    }

    .account-key {
      margin-bottom: 8px;
      font-weight: 700;
      word-break: break-word;
    }

    .account-meta {
      display: grid;
      gap: 5px;
      color: #a5a5ae;
      font-size: 13px;
    }

    .status-active {
      color: #8effb0;
    }

    .status-disabled {
      color: #ff9f9f;
    }

        .status-review {
      color: #ffd27a;
    }

    .section-title {
      margin: 18px 0 4px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    .telegram-users {
      display: grid;
      gap: 7px;
      margin-top: 10px;
    }

    .telegram-user {
      padding: 9px 10px;
      border: 1px solid #2a2a30;
      border-radius: 10px;
      background: #19191d;
      font-size: 13px;
      line-height: 1.45;
    }

    .telegram-user-name {
      font-weight: 700;
      color: #ffffff;
    }

    .telegram-user-meta {
      color: #9999a3;
    }

    .telegram-user-actions {
      margin-top: 8px;
    }

    .telegram-user-actions button {
      width: 100%;
      min-height: 36px;
      padding: 0 10px;
      font-size: 12px;
    }
    .review-box {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #6b4d13;
      border-radius: 10px;
      background: #241c0e;
      color: #ffd27a;
      font-size: 13px;
      line-height: 1.5;
    }

    .empty-section {
      padding: 12px;
      border: 1px dashed #33333a;
      border-radius: 12px;
      color: #888892;
      font-size: 13px;
    }

    .account-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    @media (min-width: 600px) {
      .account-actions {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <h1>GlobalBLAMP Admin</h1>

    <p class="subtitle">
      Manage approved API accounts.
    </p>


    <div class="card">

      <label for="adminSecretInput">
        Admin Secret
      </label>

      <input
        id="adminSecretInput"
        type="password"
        placeholder="Enter ADMIN_SECRET"
      >

      <button
        id="saveSecretBtn"
        class="secondary"
      >
        Save Admin Secret
      </button>

      <div
        id="secretMessage"
        class="message"
      ></div>

    </div>


    <div class="card">

      <label for="apiKeyInput">
        Add Approved gk API Key
      </label>

      <input
        id="apiKeyInput"
        type="password"
        placeholder="gk-..."
      >

      <button
        id="addAccountBtn"
        class="primary"
      >
        Add Account
      </button>

      <div
        id="addMessage"
        class="message"
      ></div>

    </div>


    <div class="card">

      <div class="row">

        <button
          id="refreshBtn"
          class="secondary"
        >
          Refresh Accounts
        </button>

      </div>

      <div
        id="accountsMessage"
        class="message"
      ></div>

      <div
        id="accountsList"
        class="accounts"
      ></div>

    </div>

  </div>


  <script>
    const HISTORY_API =
      "https://history.bluelamp.workers.dev";

    const adminSecretInput =
      document.getElementById("adminSecretInput");

    const apiKeyInput =
      document.getElementById("apiKeyInput");

    const saveSecretBtn =
      document.getElementById("saveSecretBtn");

    const addAccountBtn =
      document.getElementById("addAccountBtn");

    const refreshBtn =
      document.getElementById("refreshBtn");

    const secretMessage =
      document.getElementById("secretMessage");

    const addMessage =
      document.getElementById("addMessage");

    const accountsMessage =
      document.getElementById("accountsMessage");

    const accountsList =
      document.getElementById("accountsList");


    let adminSecret =
      localStorage.getItem(
        "globalblamp_admin_secret"
      ) || "";


    adminSecretInput.value = adminSecret;


    function setMessage(
      element,
      text,
      type = ""
    ) {
      element.textContent = text;

      element.classList.remove(
        "error",
        "success"
      );

      if (type) {
        element.classList.add(type);
      }
    }


    function getAdminHeaders() {
      return {
        "Content-Type": "application/json",
        "X-Admin-Secret": adminSecret
      };
    }


    saveSecretBtn.addEventListener(
      "click",
      () => {
        const value =
          adminSecretInput.value.trim();

        if (!value) {
          setMessage(
            secretMessage,
            "Enter your admin secret first.",
            "error"
          );

          return;
        }

        adminSecret = value;

        localStorage.setItem(
          "globalblamp_admin_secret",
          adminSecret
        );

        setMessage(
          secretMessage,
          "Admin secret saved on this browser.",
          "success"
        );

        loadAccounts();
      }
    );


    addAccountBtn.addEventListener(
      "click",
      addAccount
    );


    refreshBtn.addEventListener(
      "click",
      loadAccounts
    );


    async function addAccount() {
      if (!adminSecret) {
        setMessage(
          addMessage,
          "Save your admin secret first.",
          "error"
        );

        return;
      }

      const apiKey =
        apiKeyInput.value.trim();

      if (!apiKey) {
        setMessage(
          addMessage,
          "Enter a gk API key.",
          "error"
        );

        return;
      }

      setMessage(
        addMessage,
        "Adding account..."
      );

      addAccountBtn.disabled = true;

      try {
        const response = await fetch(
          `${HISTORY_API}/admin/accounts`,
          {
            method: "POST",

            headers: getAdminHeaders(),

            body: JSON.stringify({
              api_key: apiKey
            })
          }
        );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data?.error ||
            "Unable to add account"
          );
        }

        apiKeyInput.value = "";

        setMessage(
          addMessage,
          `Added ${data.account.key_preview}`,
          "success"
        );

        await loadAccounts();

      } catch (error) {
        setMessage(
          addMessage,
          error.message,
          "error"
        );

      } finally {
        addAccountBtn.disabled = false;
      }
    }


    async function loadAccounts() {
      if (!adminSecret) {
        setMessage(
          accountsMessage,
          "Save your admin secret first.",
          "error"
        );

        return;
      }


      setMessage(
        accountsMessage,
        "Loading..."
      );


      accountsList.innerHTML = "";
      refreshBtn.disabled = true;


      try {
        const response = await fetch(
          `${HISTORY_API}/admin/accounts`,
          {
            method: "GET",
            headers: getAdminHeaders()
          }
        );


        const data =
          await response.json();


        if (!response.ok) {
          throw new Error(
            data?.error ||
            "Unable to load accounts"
          );
        }


        const accounts =
          Array.isArray(data.accounts)
            ? data.accounts
            : [];


        const normalAccounts =
          accounts.filter(
            account =>
              account.lifecycle_status !==
              "review_delete"
          );


        const reviewAccounts =
          accounts.filter(
            account =>
              account.lifecycle_status ===
              "review_delete"
          );


        setMessage(
          accountsMessage,
          `${normalAccounts.length} active list • ${reviewAccounts.length} check for delete`,
          "success"
        );


        accountsList.innerHTML = "";


        const normalTitle =
          document.createElement("div");

        normalTitle.className =
          "section-title";

        normalTitle.textContent =
          "Approved APIs";

        accountsList.appendChild(
          normalTitle
        );


        if (!normalAccounts.length) {
          const empty =
            document.createElement("div");

          empty.className =
            "empty-section";

          empty.textContent =
            "No approved APIs.";

          accountsList.appendChild(
            empty
          );

        } else {
          normalAccounts.forEach(
            account => {
              renderAccount(account);
            }
          );
        }


        const reviewTitle =
          document.createElement("div");

        reviewTitle.className =
          "section-title";

        reviewTitle.textContent =
          "Check for Delete";

        accountsList.appendChild(
          reviewTitle
        );


        if (!reviewAccounts.length) {
          const empty =
            document.createElement("div");

          empty.className =
            "empty-section";

          empty.textContent =
            "No APIs waiting for review.";

          accountsList.appendChild(
            empty
          );

        } else {
          reviewAccounts.forEach(
            account => {
              renderAccount(account);
            }
          );
        }


      } catch (error) {
        setMessage(
          accountsMessage,
          error.message,
          "error"
        );

      } finally {
        refreshBtn.disabled = false;
      }
    }


    function renderAccount(account) {
      const item =
        document.createElement("div");


      item.className =
        "account-item";


      const isActive =
        Number(account.is_active) === 1;


      const isReview =
        account.lifecycle_status ===
        "review_delete";


      const status =
        isActive
          ? "Active"
          : "Disabled";


      const statusClass =
        isActive
          ? "status-active"
          : "status-disabled";


      const lifecycleText =
        isReview
          ? "Check for Delete"
          : "Approved";


      const lifecycleClass =
        isReview
          ? "status-review"
          : "status-active";


      const usedSlots =
        Number(
          account.active_telegram_users ||
          0
        );


      const maxSlots =
        Number(
          account.max_telegram_users ||
          3
        );


      const linkedUsers =
        Array.isArray(
          account.linked_telegram_users
        )
          ? account.linked_telegram_users
          : [];


      const telegramUsersHtml =
        linkedUsers.length
          ? linkedUsers
              .map(user => {
                const username =
                  user.username
                    ? `@${user.username}`
                    : "No username";


                const fullName =
                  [
                    user.first_name,
                    user.last_name
                  ]
                    .filter(Boolean)
                    .join(" ") ||
                  "No name";


                return `
                  <div class="telegram-user">

                    <div class="telegram-user-name">
                      ${escapeHtml(username)}
                    </div>

                    <div class="telegram-user-meta">
                      ${escapeHtml(fullName)}
                    </div>

                    <div class="telegram-user-meta">
                      Telegram ID:
                      ${escapeHtml(
                        String(
                          user.telegram_id ||
                          "-"
                        )
                      )}
                    </div>

<div class="telegram-user-meta">
  Linked:
  ${escapeHtml(
    user.linked_at ||
    "-"
  )}
</div>


${
  Number(
    account.legacy_chat_count ||
    0
  ) > 0
    ? `
        <div class="telegram-user-actions">
          <button
            class="secondary"
            data-action="migrate-legacy"
            data-telegram-user-id="${escapeHtml(
              String(user.id)
            )}"
          >
            Move Legacy History Here
          </button>
        </div>
      `
    : ""
}

</div>

                `;
              })
              .join("")
          : `
              <div class="telegram-user">
                <div class="telegram-user-meta">
                  No active Telegram users.
                </div>
              </div>
            `;


      const reviewHtml =
        isReview
          ? `
              <div class="review-box">

                <div>
                  <strong>
                    Check for Delete
                  </strong>
                </div>

                <div>
                  Reason:
                  ${escapeHtml(
                    account.review_reason ||
                    "-"
                  )}
                </div>

                <div>
                  Requested:
                  ${escapeHtml(
                    account.review_requested_at ||
                    "-"
                  )}
                </div>

              </div>
            `
          : "";


      item.innerHTML = `
        <div class="account-key">
          ${escapeHtml(
            account.key_preview ||
            "Unknown"
          )}
        </div>


        <div class="account-meta">

          <div>
            ID:
            ${escapeHtml(
              String(account.id)
            )}
          </div>


          <div class="${statusClass}">
            Status:
            ${status}
          </div>


          <div class="${lifecycleClass}">
            Lifecycle:
            ${lifecycleText}
          </div>


          <div>
            Telegram Usage:
            ${escapeHtml(
              String(usedSlots)
            )}
            /
            ${escapeHtml(
              String(maxSlots)
            )}
          </div>


          <div>
            Legacy Chats:
            ${escapeHtml(
              String(
                account.legacy_chat_count ||
                0
              )
            )}
          </div>


          <div>
            Telegram Chats:
            ${escapeHtml(
              String(
                account.telegram_chat_count ||
                0
              )
            )}
          </div>


          <div>
            Created:
            ${escapeHtml(
              account.created_at ||
              "-"
            )}
          </div>


          <div>
            Last active:
            ${escapeHtml(
              account.last_active_at ||
              "-"
            )}
          </div>

        </div>


        <div class="telegram-users">

          <div class="account-key">
            Linked Telegram Users
          </div>

          ${telegramUsersHtml}

        </div>


        ${reviewHtml}


        <div class="account-actions">

          <button
            class="${
              isReview
                ? "success-button"
                : isActive
                  ? "warning"
                  : "success-button"
            }"
            data-action="status"
          >
            ${
              isReview
                ? "Reactivate"
                : isActive
                  ? "Disable"
                  : "Enable"
            }
          </button>


          <button
            class="secondary"
            data-action="history"
          >
            Delete Legacy History
          </button>


          ${
            isReview
              ? `
                  <button
                    class="danger"
                    data-action="delete"
                  >
                    Permanently Delete
                  </button>
                `
              : ""
          }

        </div>
      `;


      const statusButton =
        item.querySelector(
          '[data-action="status"]'
        );


      const historyButton =
        item.querySelector(
          '[data-action="history"]'
        );


      const deleteButton =
        item.querySelector(
          '[data-action="delete"]'
        );


      statusButton.addEventListener(
        "click",
        () => {
          setAccountStatus(
            account,
            isReview
              ? true
              : !isActive
          );
        }
      );


      historyButton.addEventListener(
        "click",
        () => {
          deleteAccountHistory(
            account
          );
        }
      );


      const migrationButtons =
        item.querySelectorAll(
          '[data-action="migrate-legacy"]'
        );


      migrationButtons.forEach(
        button => {
          button.addEventListener(
            "click",
            () => {
              const telegramUserId =
                Number(
                  button.dataset
                    .telegramUserId
                );


              const telegramUser =
                linkedUsers.find(
                  user =>
                    Number(user.id) ===
                    telegramUserId
                );


              if (!telegramUser) {
                return;
              }


              migrateLegacyHistory(
                account,
                telegramUser
              );
            }
          );
        }
      );


      accountsList.appendChild(
        item
      );
    }


    async function setAccountStatus(
      account,
      newStatus
    ) {
      const actionText =
        newStatus
          ? "enable"
          : "disable";

      const confirmed = confirm(
        `Are you sure you want to ${actionText} ${account.key_preview}?`
      );

      if (!confirmed) {
        return;
      }

      setMessage(
        accountsMessage,
        `${actionText === "enable"
          ? "Enabling"
          : "Disabling"} account...`
      );

      try {
        const response = await fetch(
          `${HISTORY_API}/admin/accounts/${account.id}/status`,
          {
            method: "POST",

            headers: getAdminHeaders(),

            body: JSON.stringify({
              is_active: newStatus
            })
          }
        );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data?.error ||
            "Unable to update account"
          );
        }

        setMessage(
          accountsMessage,
          newStatus
            ? "Account enabled."
            : "Account disabled.",
          "success"
        );

        await loadAccounts();

      } catch (error) {
        setMessage(
          accountsMessage,
          error.message,
          "error"
        );
      }
    }

    async function migrateLegacyHistory(
      account,
      telegramUser
    ) {
      const username =
        telegramUser.username
          ? `@${telegramUser.username}`
          : `Telegram ID ${telegramUser.telegram_id}`;


      const legacyCount =
        Number(
          account.legacy_chat_count ||
          0
        );


      const confirmed = confirm(
        `Move ALL ${legacyCount} legacy chat(s) from ${account.key_preview} to ${username}?\n\nOnly do this if you know this old history belongs to this Telegram user.`
      );


      if (!confirmed) {
        return;
      }


      const secondConfirm = confirm(
        `After migration, those chats will permanently belong to ${username} and will survive API replacement/deletion.\n\nContinue?`
      );


      if (!secondConfirm) {
        return;
      }


      setMessage(
        accountsMessage,
        "Migrating legacy history..."
      );


      try {
        const response =
          await fetch(
            `${HISTORY_API}/admin/accounts/${account.id}/migrate-legacy-history`,
            {
              method: "POST",

              headers:
                getAdminHeaders(),

              body: JSON.stringify({
                telegram_user_id:
                  telegramUser.id
              })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {
          throw new Error(
            data?.error ||
            "Unable to migrate legacy history"
          );
        }


        setMessage(
          accountsMessage,
          `${data.migrated_chats} legacy chat(s) moved to ${username}.`,
          "success"
        );


        await loadAccounts();


      } catch (error) {
        setMessage(
          accountsMessage,
          error.message,
          "error"
        );
      }
    }

    async function deleteAccountHistory(
      account
    ) {
      const confirmed = confirm(
        `Delete LEGACY API history for ${account.key_preview}?\n\nTelegram-owned chat history will NOT be deleted.`
      );

      if (!confirmed) {
        return;
      }

      const secondConfirm = confirm(
        "This permanently deletes only old API-owned chats and their messages. Continue?"
      );

      if (!secondConfirm) {
        return;
      }

      setMessage(
        accountsMessage,
        "Deleting history..."
      );

      try {
        const response = await fetch(
          `${HISTORY_API}/admin/accounts/${account.id}/history`,
          {
            method: "DELETE",
            headers: getAdminHeaders()
          }
        );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data?.error ||
            "Unable to delete history"
          );
        }

        setMessage(
          accountsMessage,
          "Account history deleted.",
          "success"
        );

        await loadAccounts();

      } catch (error) {
        setMessage(
          accountsMessage,
          error.message,
          "error"
        );
      }
    }


    async function deleteAccount(
      account
    ) {
      const confirmed = confirm(
        `Permanently delete ${account.key_preview}?\n\nLegacy API history will be deleted. Telegram-owned history will remain.`
      );

      if (!confirmed) {
        return;
      }

      const secondConfirm = confirm(
        "This cannot be undone. Delete this account permanently?"
      );

      if (!secondConfirm) {
        return;
      }

      setMessage(
        accountsMessage,
        "Deleting account..."
      );

      try {
        const response = await fetch(
          `${HISTORY_API}/admin/accounts/${account.id}`,
          {
            method: "DELETE",
            headers: getAdminHeaders()
          }
        );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data?.error ||
            "Unable to delete account"
          );
        }

        setMessage(
          accountsMessage,
          "Account deleted.",
          "success"
        );

        await loadAccounts();

      } catch (error) {
        setMessage(
          accountsMessage,
          error.message,
          "error"
        );
      }
    }


    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    if (adminSecret) {
      loadAccounts();
    }
  </script>

</body>
</html>
